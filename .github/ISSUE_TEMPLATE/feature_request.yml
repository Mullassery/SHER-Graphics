name: Feature request / design proposal
description: Propose new functionality, or a change to the native API/runtime/abstraction design.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This is early, architecture-defining work — design feedback and
        proposals are the most valuable kind of contribution right now.
        See `CONTRIBUTING.md` and `ARCHITECTURE.md` before filing.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: What's missing or awkward today, concretely.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How you'd like it to work. Reference relevant ARCHITECTURE.md sections if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you didn't pick them.
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary check
      options:
        - label: This does not reimplement anything SHER-Kernel's `gpu_driver` already owns.
          required: true
