name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # SHER-KERNEL is consumed via relative path dependencies
      # (../SHER-KERNEL/crates/...), so it must be checked out as a sibling
      # directory under the same workspace root as SHER-Graphics, using the
      # real repo's exact casing (all-caps on GitHub). Cargo.toml was fixed
      # to point at ../SHER-KERNEL (was ../SHER-Kernel, which only resolved
      # on case-insensitive filesystems); this checkout path must match or
      # CI breaks on the next push since actions/checkout's `path:` creates
      # a local directory with whatever name you give it, independent of
      # the real repo name.
      - name: Checkout SHER-Graphics
        uses: actions/checkout@v4
        with:
          path: SHER-Graphics

      - name: Checkout SHER-KERNEL
        uses: actions/checkout@v4
        with:
          repository: Mullassery/SHER-KERNEL
          path: SHER-KERNEL

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `crates/vulkan_backend` talks to a real Vulkan loader/ICD via
      # `ash`. It never fails the build without one (see that crate's
      # module docs: `ash`'s `loaded` feature dlopen()s the loader at
      # runtime, not link time), but installing Mesa's lavapipe here means
      # its tests exercise a real, if CPU-rendered, Vulkan device on CI
      # instead of hitting their "no loader available" skip path — the
      # same honesty bar as the rest of this pass: don't just claim real
      # Vulkan works, prove it runs somewhere that isn't the maintainer's
      # own machine.
      - name: Install a software Vulkan ICD (Mesa lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          vulkaninfo --summary || true

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            SHER-Graphics/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('SHER-Graphics/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Deliberately not `cargo fmt --all`: rustfmt's --all also formats
      # path dependencies, which would reach into SHER-Kernel.
      - name: cargo fmt --check
        working-directory: SHER-Graphics
        run: cargo fmt -- --check

      - name: cargo build (all targets, including examples)
        working-directory: SHER-Graphics
        run: cargo build --workspace --all-targets

      - name: cargo test
        working-directory: SHER-Graphics
        run: cargo test --workspace

      - name: cargo clippy
        working-directory: SHER-Graphics
        run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SHER-Graphics
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Scans Cargo.lock against the RustSec advisory database. This repo
      # has one non-workspace-internal dependency (ash, in
      # crates/vulkan_backend) plus its transitive deps (libloading,
      # cfg-if) — everything else is a `sher_*`/`hal`/`gpu_driver` path
      # dependency on the sibling SHER-Kernel checkout, which isn't on
      # crates.io and so isn't in the advisory database either way.
      - name: cargo audit
        run: cargo audit
