[workspace]
members = [
    "crates/graphics_api",
    "crates/gpu_abstraction",
    "crates/graphics_runtime",
    "crates/graphics_compat",
    "crates/vulkan_backend",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/Mullassery/SHER-Graphics"

[workspace.dependencies]
# NOTE: real repo is "SHER-KERNEL" (all caps, github.com/Mullassery/SHER-KERNEL).
# "SHER-Kernel" only resolves on case-insensitive filesystems (macOS/APFS); it
# fails `cargo check` on any case-sensitive Linux filesystem. See SHER-Display's
# Cargo.toml for the verified repro (built in a real ubuntu:24.04 container).
sher_common = { path = "../SHER-KERNEL/crates/common" }
sher_objectmodel = { path = "../SHER-KERNEL/crates/objectmodel" }
sher_security = { path = "../SHER-KERNEL/crates/security" }
hal = { path = "../SHER-KERNEL/crates/hal" }
gpu_driver = { path = "../SHER-KERNEL/crates/gpu_driver" }
